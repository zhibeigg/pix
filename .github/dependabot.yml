version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - "httpx"
          - "pydantic*"
          - "Pillow"
          - "numpy"
          - "scikit-learn"
          - "typer"
          - "rich"
          - "python-dotenv"
          - "tomli*"
      gui:
        patterns:
          - "PySide6*"
          - "shiboken6*"
      dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "pyinstaller"
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
