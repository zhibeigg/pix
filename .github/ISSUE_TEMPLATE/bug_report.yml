name: Bug report
description: 报告一个 bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 清晰描述现象；尽量贴错误文本、截图或日志。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步一步写，让别人能照着复现。
      placeholder: |
        1. 启动 `pix gui`
        2. 选择 `pico8` 预设
        3. 加载 xxx.png
        4. 点运行
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pix 版本
      placeholder: e.g. 0.1.0 或 commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10 / 11
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Ubuntu / Debian
        - 其它 Linux
        - 其它
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: e.g. 3.11.9（`python --version`）
  - type: textarea
    id: extra
    attributes:
      label: 其它上下文
      description: 配置文件、日志、meta.json、屏幕录像都欢迎。
