name: Feature request
description: 提一个功能建议
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说问题和场景，再说具体方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 pix 怎么做。欢迎伪代码、UI 草图、API 设计。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过哪些替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: CLI
        - label: GUI
        - label: 管线 / 像素化算法
        - label: API / 第三方集成
        - label: 文档 / i18n
