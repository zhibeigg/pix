name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete Git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts="--all"

  python-quality:
    name: Python quality and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Check lint
        run: uv run ruff check src tests scripts/check_release_version.py scripts/extract_release_notes.py scripts/generate_release_manifest.py
      - name: Check version consistency
        run: uv run python scripts/check_release_version.py
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --output-file audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement audit-requirements.txt
      - name: Run high-confidence Bandit checks
        run: uvx --from bandit==1.9.4 bandit -r src -lll -iii

  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Run tests from lockfile
        run: uv run --frozen --extra dev --python ${{ matrix.python-version }} pytest -q

  python-dist:
    name: Python distribution smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build --wheel --sdist --out-dir dist
      - name: Install wheel in an isolated environment
        run: |
          uv venv .dist-venv
          uv pip install --python .dist-venv/bin/python dist/*.whl
          .dist-venv/bin/python - <<'PY'
          from importlib.metadata import entry_points
          from pix.pixelize.presets import list_presets
          import pix_web.main

          expected_presets = {"auto", "gameboy", "modern_pixel", "nes", "pico8"}
          assert expected_presets.issubset(set(list_presets()))
          scripts = {entry.name for entry in entry_points(group="console_scripts")}
          expected_scripts = {"pix-web-api", "pix-web-worker", "pix-web-rq-worker", "pix-web-check", "pix-update-agent"}
          assert expected_scripts.issubset(scripts)
          PY
      - name: Upload Python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test -- --run
      - name: Build production assets
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Upload frontend assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist/web
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create non-secret release Compose environment
        run: |
          python - <<'PY'
          from pathlib import Path

          Path(".env.production").write_text(
              "\n".join(
                  [
                      "PIX_WEB_ENV=prod",
                      "PIX_WEB_JWT_SECRET=ci-only-jwt-secret-at-least-32-bytes-long",
                      "PIX_WEB_EMAIL_PROVIDER=console",
                      "PIX_WEB_UPDATE_APPLY_ENABLED=false",
                      "PIX_UPDATER_ENABLED=false",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          Path("release.env").write_text(
              "\n".join(
                  [
                      "PIX_BACKEND_IMAGE=ghcr.io/zhibeigg/pix-backend@sha256:" + "1" * 64,
                      "PIX_FRONTEND_IMAGE=ghcr.io/zhibeigg/pix-web@sha256:" + "2" * 64,
                      "PIX_UPDATER_IMAGE=ghcr.io/zhibeigg/pix-updater@sha256:" + "3" * 64,
                      "PIX_RELEASE_VERSION=0.0.0",
                      "PIX_RELEASE_COMMIT=" + "0" * 40,
                      "PIX_RELEASE_MANIFEST_SHA256=" + "4" * 64,
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate release Compose configuration
        run: docker compose --env-file .env.production --env-file release.env --file compose.release.yml config --quiet
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,mode=max,scope=backend-ci
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend-ci
          cache-to: type=gha,mode=max,scope=frontend-ci
      - name: Build updater image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.updater
          push: false
          cache-from: type=gha,scope=updater-ci
          cache-to: type=gha,mode=max,scope=updater-ci

  compose-smoke:
    name: Compose health smoke
    needs: [secrets, python-quality, python-tests, python-dist, frontend, docker-build]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create non-secret CI environment
        run: |
          python - <<'PY'
          from pathlib import Path

          Path(".env.production").write_text(
              "\n".join(
                  [
                      "PIX_WEB_ENV=prod",
                      "PIX_WEB_JWT_SECRET=ci-only-jwt-secret-at-least-32-bytes-long",
                      "PIX_WEB_EMAIL_PROVIDER=console",
                      "PIX_WEB_PUBLIC_BASE_URL=http://localhost:8080/api",
                      "PIX_WEB_FRONTEND_BASE_URL=http://localhost:8080",
                      "PIX_WEB_CORS_ORIGINS=http://localhost:8080",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start application stack
        run: docker compose up --detach --build web
      - name: Wait for API and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/homepage-examples/sprites/08_dark_fantasy_undead_greatsword.png >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Show Compose diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color postgres redis migrate api web
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
