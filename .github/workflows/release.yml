name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            python: "3.11"
            archive_ext: zip
          - os: macos-13
            label: macos-x86_64
            python: "3.11"
            archive_ext: tar.gz
          - os: macos-14
            label: macos-arm64
            python: "3.11"
            archive_ext: tar.gz
          - os: ubuntu-latest
            label: linux-x86_64
            python: "3.11"
            archive_ext: tar.gz
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller==6.11.1

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean build_tools/pix.spec

      - name: List dist (debug)
        shell: bash
        run: ls -la dist/

      # ---------- Windows ----------
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "pix-${{ steps.tag.outputs.name }}-${{ matrix.label }}"
          Compress-Archive -Path dist/pix/* -DestinationPath "dist/$name.zip"
          echo "ARTIFACT=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---------- macOS ----------
      - name: Package (macOS tar.gz)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          NAME="pix-${{ steps.tag.outputs.name }}-${{ matrix.label }}"
          cd dist
          # 只保留 .app bundle（更干净）；若没有生成则回退到 one-dir
          if [ -d "pix.app" ]; then
            tar -czf "${NAME}.tar.gz" "pix.app"
          else
            tar -czf "${NAME}.tar.gz" "pix"
          fi
          cd ..
          echo "ARTIFACT=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"

      # ---------- Linux ----------
      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NAME="pix-${{ steps.tag.outputs.name }}-${{ matrix.label }}"
          cd dist
          tar -czf "${NAME}.tar.gz" "pix"
          cd ..
          echo "ARTIFACT=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Generate SHA256
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          else
            powershell -Command "(Get-FileHash -Algorithm SHA256 '$env:ARTIFACT').Hash + '  ' + (Split-Path -Leaf '$env:ARTIFACT')" > "${ARTIFACT}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pix-${{ matrix.label }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: pix ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: release/*
          body: |
            ## Downloads

            | Platform | Archive |
            |---|---|
            | Windows x64 | `pix-${{ steps.tag.outputs.name }}-windows-x64.zip` |
            | macOS Intel | `pix-${{ steps.tag.outputs.name }}-macos-x86_64.tar.gz` |
            | macOS Apple Silicon | `pix-${{ steps.tag.outputs.name }}-macos-arm64.tar.gz` |
            | Linux x86_64 | `pix-${{ steps.tag.outputs.name }}-linux-x86_64.tar.gz` |

            All archives include a matching `.sha256` checksum file.

            ### Quick start

            1. Download the archive for your platform and extract.
            2. Run `pix` (or `pix.exe` on Windows / `pix.app` on macOS) to open the GUI.
            3. Or pass arguments for CLI usage, e.g. `pix gen "a pixel cat"`.

            First time? Open **File → Settings…** to configure your provider and API keys.
