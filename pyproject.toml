[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pix"
version = "1.74.0"
description = "Web pixel-art asset generation service with FastAPI backend and React frontend."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "纸杯 (zhibeigg)", email = "785740487@qq.com" }]
keywords = ["pixel-art", "ai", "image-generation", "fastapi", "gpt-image"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "Pillow>=10.2",
    "numpy>=1.26",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "PyJWT>=2.12.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "alembic>=1.13",
    "redis>=5",
    "rq>=2",
    "psycopg[binary]>=3.1",
    "cryptography>=42",
    "alipay-sdk-python>=3.7.1160",
]

[project.urls]
Homepage = "https://github.com/zhibeigg/pix"
Repository = "https://github.com/zhibeigg/pix"
Issues = "https://github.com/zhibeigg/pix/issues"

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
pix-web-api = "pix_web.main:run_dev"
pix-web-worker = "pix_web.worker:main"
pix-web-rq-worker = "pix_web.rq_worker:main"
pix-web-check = "pix_web.checks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = ["outputs", "web_outputs", ".pix_cache", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports etc.)
    "B",    # flake8-bugbear（潜在 bug，比如可变默认参数）
    "W",    # pycodestyle warnings
]
# 风格类规则（import 排序 / 类型注解现代化）暂不强制，
# 留给后续 PR 逐步 tidy，避免一次性大改影响 diff 审查。
# 如果想启用：把 "I" / "UP" 加回来并单独跑 `ruff check --select I --fix`。
ignore = [
    "E501",  # 行长度交给 formatter 自觉遵循，避免为几个字符频繁打断
    "B008",  # FastAPI 风格的 Depends() 在默认值里调用是惯例
    "B904",  # raise ... from 强制打开后约束太严
]
