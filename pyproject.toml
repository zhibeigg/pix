[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pix"
version = "0.1.0"
description = "Prompt → AI image → multimodal JSON → pixel art pipeline, with CLI and PySide6 GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "纸杯 (zhibeigg)", email = "92575122+zhibeigg@users.noreply.github.com" }]
keywords = ["pixel-art", "ai", "image-generation", "multimodal", "packy", "gpt-image"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "Pillow>=10.2",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/zhibeigg/pix"
Repository = "https://github.com/zhibeigg/pix"
Issues = "https://github.com/zhibeigg/pix/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
pix = "pix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pix = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["outputs", ".pix_cache", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports etc.)
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",  # 行长度交给 formatter 自觉遵循，避免为几个字符频繁打断
    "B008",  # Typer/FastAPI 风格的 Depends()/Argument() 在默认值里调用是惯例
    "B904",  # raise ... from 强制打开后约束太严
    "UP038", # isinstance(x, (A, B)) 在 3.10 里仍是更易读的写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E712"]  # assert False 在测试里是常见写法
