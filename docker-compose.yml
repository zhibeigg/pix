services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pix}
      # 必须在 .env / .env.production 显式提供强密码；未设置时 compose 会报错拒绝启动。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置为强随机密码}
      POSTGRES_DB: ${POSTGRES_DB:-pix}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pix} -d ${POSTGRES_DB:-pix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      PIX_WEB_ENV: prod
      PIX_WEB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}@postgres:5432/${POSTGRES_DB:-pix}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      PIX_WEB_ENV: prod
      PIX_WEB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}@postgres:5432/${POSTGRES_DB:-pix}
      PIX_WEB_REDIS_URL: redis://redis:6379/0
      PIX_WEB_QUEUE_BACKEND: rq
      PIX_WEB_AUTO_CREATE_DB: "false"
    volumes:
      - web_outputs:/app/web_outputs
      - pix_outputs:/app/outputs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      PIX_WEB_ENV: prod
      PIX_WEB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}@postgres:5432/${POSTGRES_DB:-pix}
      PIX_WEB_REDIS_URL: redis://redis:6379/0
      PIX_WEB_QUEUE_BACKEND: rq
      PIX_WEB_AUTO_CREATE_DB: "false"
      PIX_WEB_RQ_WORKER_CLASS: default
    command: ["pix-web-rq-worker"]
    volumes:
      - web_outputs:/app/web_outputs
      - pix_outputs:/app/outputs
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_PIX_API_BASE: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  web_outputs:
  pix_outputs:
