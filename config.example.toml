# Pix Web 核心配置示例
# 如需覆盖默认素材生成参数，可复制为 config.toml，并通过 PIX_WEB_PIX_CONFIG 指向该文件。
# 网站版管理后台也可以覆盖 [api] 调用策略、[image_gen]、[vision] 和 [asset] 中的常用字段；
# 供应商密钥和 Base URL 请优先使用后台「上游供应商」；环境级密钥/数据库/队列配置仍建议使用环境变量或密钥管理。

[api]
# 通用上游调用网络参数；base_url 仅保留给旧 PACKY_* 兼容路径和首次种子导入，新部署请使用「上游供应商」。
base_url       = "https://www.packyapi.com"
# 连接与读取超时（秒）；生图/序列帧高 quality 时单次响应可能持续数分钟，给足余量
timeout        = 600.0
max_retries    = 3
# 仅对 HTTP 429/5xx 和网络/超时类临时错误重试；prompt/策略类错误不会重试。
# 默认不信任系统代理，避免本地 Clash 等代理在长 idle 连接上提前断开生图响应。
# 需要走代理时把 trust_env_proxies = true 或填 proxy = "http://127.0.0.1:7890"。
trust_env_proxies = false
proxy = ""

# 多 Provider 生图配置。同一个 logical model 可配置多个 provider，运行时按 priority 自动失败切换。
# 注意：供应商现以管理后台「上游供应商」为单一真相源（存数据库 image_providers 表）。
# 下面的 [[image_providers]] 仅在该表为空时作为首次启动的种子导入；之后请在后台增删改
# （即时生效、无需重启）。如需重新从本文件导入，清空 image_providers 表即可。
[[image_providers]]
id = "crazyrouter"
display_name = "Crazyrouter"
enabled = true
base_url = "https://crazyrouter.com"
api_key_env = "CRAZYROUTER_API_KEY"
priority = 30
discover_models = true
protocols = ["openai_images", "midjourney", "ideogram", "fal", "kling", "gemini_native"]

[[image_providers.models]]
id = "image2"
provider_model = "gpt-image-2"
label = "image2"
protocol = "openai_images"
operations = ["text_to_image", "image_to_image"]
sizes = ["auto", "1024x1024", "1536x1024", "1024x1536", "2048x1024", "1024x2048"]
qualities = ["auto", "low", "medium", "high"]
output_formats = ["png", "jpeg", "webp"]
# image2 会映射到上游 gpt-image-2；当前不支持 input_fidelity，Provider 请求会按此能力决定是否发参。
extra = { supports_input_fidelity = false }

[[image_providers]]
id = "packy"
display_name = "Packy（兼容旧部署）"
enabled = true
base_url = "https://www.packyapi.com"
api_key_env = "PACKY_API_KEY"
priority = 10
discover_models = false
protocols = ["openai_images"]

[[image_providers.models]]
id = "image2"
provider_model = "gpt-image-2"
label = "image2"
protocol = "openai_images"
operations = ["text_to_image", "image_to_image"]
sizes = ["auto", "1024x1024", "1536x1024", "1024x1536", "2048x1024", "1024x2048"]
qualities = ["auto", "low", "medium", "high"]
output_formats = ["png", "jpeg", "webp"]
# image2 会映射到上游 gpt-image-2；当前不支持 input_fidelity，Provider 请求会按此能力决定是否发参。
extra = { supports_input_fidelity = false }

# 胜算云（ShengSuanYun）：异步任务协议（POST 提交 + GET 轮询），OpenAI gpt-image 兼容请求体。
# 检测到 SHENGSUANYUN_API_KEY 环境变量时也会自动注入，无需在此显式配置。
[[image_providers]]
id = "shengsuanyun"
display_name = "ShengSuanYun（胜算云）"
enabled = true
base_url = "https://router.shengsuanyun.com"
api_key_env = "SHENGSUANYUN_API_KEY"
priority = 20
discover_models = false
protocols = ["shengsuanyun"]

[[image_providers.models]]
id = "image2"
provider_model = "openai/gpt-image-2"
label = "image2"
protocol = "shengsuanyun"
operations = ["text_to_image", "image_to_image"]
sizes = ["auto", "1024x1024", "1536x1024", "1024x1536", "2048x1024", "1024x2048"]
qualities = ["auto", "low", "medium", "high"]
output_formats = ["png", "jpeg", "webp"]
# 图生图通过 image 字段（base64 data URL）走同一异步端点；不发 input_fidelity。
edit_mode = "image_input"
extra = { supports_input_fidelity = false }

[image_gen]
model          = "image2"
size           = "1024x1024"      # 见 Packy 文档；auto/1024x1024/1536x1024/1024x1536/2048x2048/...；UI 组件 asset 默认会覆盖为 auto
quality        = "high"           # low | medium | high | auto
output_format  = "png"
# 图生图编辑时尽量保留原图主体和细节：low | high
edit_input_fidelity = "high"
# 参考图微调（image_to_image，会进入像素化）是否复用素材直出的像素风 prompt：
# true = 把上传图当参考图、按 TRUE 像素风重绘（与素材直出一致，可在 prompt 用「图1」指代参考图）；
# false = 把用户原文直接发给模型。仅作用于会像素化的微调；source_only 的“原生大图”不受影响。
image_to_image_pixel_prompt = true
# Provider 失败切换：仅对网络、超时、429/5xx、空响应、结构异常、临时不可用、鉴权/余额等可切换错误生效。
failover_enabled = true
failover_on = ["network", "timeout", "rate_limit", "server_error", "empty_response", "malformed_response", "provider_unavailable", "auth", "quota"]
# 模型发现：Crazyrouter 等支持发现接口的 provider 会缓存结果，并经过 allowlist 过滤；生图下拉只保留 image2 / Gemini 3.1 Flash / Gemini 3 Pro。
model_discovery_enabled = true
model_discovery_ttl_seconds = 3600
provider_poll_interval_seconds = 2.0
# 候选生图默认关闭：避免一次任务生成多张候选图导致上游成本放大；需要质量优先时可手动开启。
contact_sheet_enabled = false
contact_sheet_rows = 3
contact_sheet_cols = 3
# auto 会按 prompt 动态选择不易撞色的纯色背景（如 #FF00FF/#00FFFF/#00FF00），也可固定为某个 HEX。
# 绿色背景不适合所有题材：玉石/毒液/草地等会和 #00FF00 撞色。
green_screen_color = "auto"
green_screen_tolerance = 48
contact_sheet_prompt_template = "Create a {rows}x{cols} contact sheet containing exactly {count} distinct TRUE pixel-art game asset candidates from this generation brief: {description}. In every cell, follow the generation brief exactly, not a painted digital illustration. Canvas size for each candidate must be exactly {width}x{height} pixels, where each pixel is one square cell of a conceptual pixel grid (do not draw any visible grid lines or graph paper). Use large, chunky readable pixels, limited colors, and a simple silhouette. For human characters, make sure the face is flat and no shadow. The subject must be centered with clear empty pixel rows around all edges for safe sprite padding and clean extraction. Use one flat solid key-color {green} for every candidate background and all empty cells for chroma-key removal — each background must be perfectly uniform with NO gradient, NO vignette, NO lighting or shading, and NO drawn grid lines, graph paper, or visible cell borders/separators between candidates; keep every visible subject color outside the maximum key-color tolerance ({key_tolerance} RGB Euclidean distance) from {green}. No anti-aliasing or smoothing — every pixel must be a perfect square aligned to the conceptual pixel grid. The output image should be pixel-perfect, each cell only contains one color. No text, no watermark, no extra frame, no labels."
# 用户描述审核：本地规则默认生效；remote=true 时会尝试用 VL/chat 模型审核用户原始输入，失败默认退回本地规则。
prompt_guard_enabled = true
prompt_guard_remote = true
prompt_guard_model = ""              # 留空使用 [vision].model
prompt_guard_failure_policy = "local" # local | reject
prompt_guard_max_chars = 3000 # 用户原始描述上限；Web 表单和后端校验统一为 3000 字
# 候选排序：候选图片会直接以 multipart 文件上传给 VL 按效果评分，最高分作为默认 01_source.png。
candidate_vl_ranking_enabled = true
candidate_vl_ranking_model = ""              # 留空使用候选评分默认模型 claude-opus-4-8
candidate_vl_ranking_failure_policy = "first" # first | reject
# 候选生成模式：
#   n_sample     —— 直接让模型返回 N 张独立 full-res 图，每张单独抠色，VL 看 full-res 评分（推荐）
#   contact_sheet —— 旧路径：生成 RxC 九宫格再切图；候选细节更少
candidate_mode = "n_sample"
# n_sample 模式下的候选数量；默认 1，避免多图成本，质量优先时可调高到 3~6。
n_sample_count = 1
# 若 provider 单次 n=N 不够 N 张，fallback 循环补齐时追加的 prompt 变体（非强约束，仅鼓励差异）
n_sample_prompt_variations = [
    "slight variation in color tone.",
    "slight variation in lighting and highlight.",
    "slight variation in material texture emphasis.",
    "slight variation in silhouette pose.",
]
n_sample_prompt_template = "Create one TRUE pixel-art game asset candidate from this generation brief: {description}. Follow the generation brief exactly, not a painted digital illustration. Canvas size must be exactly {width}x{height} pixels, where each pixel is one square cell of a conceptual pixel grid (do not draw any visible grid lines or graph paper). Use large, chunky readable pixels, limited colors, and a simple silhouette. For human characters, make sure the face is flat and no shadow. The subject must be centered with clear empty pixel rows around all edges for safe sprite padding and clean extraction. Use one flat solid key-color {green} for the entire background and fill it edge to edge for chroma-key removal — the background must be perfectly uniform with NO gradient, NO vignette, NO lighting or shading, and NO drawn grid lines or graph paper; keep every visible subject color outside the maximum key-color tolerance ({key_tolerance} RGB Euclidean distance) from {green}. No anti-aliasing or smoothing — every pixel must be a perfect square aligned to the conceptual pixel grid. The output image should be pixel-perfect, each cell only contains one color. No text, no watermark, no extra frame, no labels."

[vision]
# Packy 支持的视觉模型，示例：claude-opus-4-8 / claude-sonnet-4-5 / gemini-2.5-pro / gpt-4o 等
model          = "claude-opus-4-8"
temperature    = 0.2
max_tokens     = 2048
# 连续 JSON 校验失败时的重试次数
retry_on_parse = 1

[pixelize]
# 目标像素图尺寸（宽, 高）
output_size    = [128, 128]
# 调色板颜色数（4..256）
colors         = 16
# none | ordered | floyd_steinberg
dither         = "floyd_steinberg"
# 预设：auto | gameboy | nes | modern_pixel | pico8
preset         = "auto"
# 预览放大倍数（0 表示不输出放大预览）
preview_scale  = 4
# 主体轻微锐化强度 0..1
edge_enhance   = 0.1
# 饱和度缩放 0.5..1.5
saturation     = 1.0
# 下采样策略：smart（推荐，自动对齐像素格）| box | bicubic | lanczos | nearest
resample       = "smart"
# smart 模式下是否探测输入的像素格并吸附到整数倍
snap_to_grid   = true
# 自动抠背景：参考 pixel_bg，边框中位数 key 色 + 双阈值连通域变透明，保存为 PNG 带 alpha
remove_bg      = false
# 背景容差：26 对应参考项目默认 t_core=60 / t_grow=120；更低值会收紧阈值
bg_tolerance   = 12
# 边缘风格：hard=不额外处理，feather=alpha 羽化，outline=外侧描边（三者互斥）
# 低像素透明素材会尊重用户/配置选择，不再自动强制改用 outline。
edge_style     = "hard"
# 边缘强度：edge_style=feather 时为羽化半径；outline 时为描边宽度；hard 时不生效
bg_feather     = 0
# 自动裁剪主体后再缩小，适合图标/物品素材
auto_crop      = false
crop_padding   = 0.12
crop_square    = true
# 调色板策略：
#   auto   —— 保持经典 K-means 量化（默认，兼容旧行为）
#   ramp   —— VL（失败时本地按 HSL 聚合兜底）给出 outline→shadow→mid→highlight 色相阶梯，Lab 最近色量化
#   kmeans —— 强制 K-means，禁止 VL 介入
palette_mode   = "auto"
# AI 生图/图生图源图进入像素化前的首步网格对齐预处理；本地上传 pixelize 默认不启用。
# perfect_pixel=使用内置 perfectPixel 风格 FFT+Sobel 网格采样；legacy/none=旧流程。
generated_preprocess_method = "perfect_pixel"

[asset]
# 网站素材直出 asset 任务的默认值。
output_dir     = "图片"
# 仅支持 ≥16x16，所有尺寸统一走 extract Pixel Grid
pixel_size     = [16, 16]
colors         = 8
dither         = "none"
preview_scale  = 12
# 同步复制原始生图源文件到最终目录旁边，便于对比：xxx_source.png
source_copy    = true
image_quality  = "low"
skip_vl        = true
remove_bg      = true
bg_tolerance   = 26
# 背景移除算法：默认使用 pixel_bg 双阈值连通域 + 二值 alpha；会清理主体内部封闭 key 背景。
bg_removal_algorithm = "pixel_bg" # pixel_bg（旧值 imagemagick_fuzz_floodfill_alpha/color_to_alpha/auto 等会兼容到同一路径）
# 旧 Color-to-Alpha 参数保留兼容历史配置；默认背景移除不再使用全局 Color-to-Alpha。
color_to_alpha_shape = "sphere" # sphere | cube
color_to_alpha_transparency = 48
color_to_alpha_opacity = 255
color_to_alpha_interpolation = "linear"
# 默认不做额外边缘处理；可按需改为 feather 或 outline
edge_style     = "hard"
bg_feather     = 0
auto_crop      = true
crop_padding   = 0.12
crop_square    = true
# 默认启用 Pixel Grid JSON 工程图：先提取 XY 网格 JSON，再精确渲染最终 PNG
grid_mode      = true
# 是否保留 .grid.json 工程文件
grid_json      = true
# Grid 后处理默认关闭，最大程度保留经典单图纯色背景提取结果；需要时可显式开启清噪/轮廓加粗
grid_cleanup   = false
grid_outline   = false
grid_outline_strength = 1
grid_min_neighbors = 1
# 生成后是否把主体 bbox 确定性贴合目标画布；默认关闭以保留早期单图的自然留白
fit_canvas      = false
fit_mode        = "smart"  # smart | contain | stretch
fit_padding     = 1
fit_min_axis_coverage = 0.7
# Asset 直出默认使用经典 auto/K-means 调色，贴近早期单图素材效果；可手动改为 ramp。
# 可选：auto | ramp | kmeans。
palette_mode    = "auto"
# 默认模板只需要用户填写 Subject 后的主体内容；Web 可通过素材类型/主体类型选择入口参数。
# asset_kind 支持 item_icon（物品图标）、ui_component（UI 组件）、tile_texture（平铺纹理）和 game_logo（游戏 Logo）。
# 平铺纹理会跳过下面的普通素材模板，改用专用 tile prompt；asset.texture_kind 可选 auto/generic_texture/terrain_ground/path_floor/wall_surface/wood_planks/water_liquid/foliage_canopy/roof_tile/metal_panel/fabric_carpet，用于注入常见像素游戏纹理规则。
# UI 组件直出会使用 image_size="auto" 生图源尺寸，目标像素尺寸仍由 pixel_size / 请求 output_size 控制。
# {width}x{height} 随输出尺寸自动填充；{max_colors}/{colors} 使用用户实际选择的颜色上限；{key_tolerance} 仅约束背景与主体的最小色距。
# {asset_kind_label}/{asset_usage_label}/{subject_kind_label}/{placement_context}/{forbidden_elements} 会按素材类型自动分开填充，避免同一 prompt 混写物品、UI、纹理或 Logo 语义；自定义模板不要写死 No text，Logo 文字限制请交给 {forbidden_elements}。
prompt_template = "Convert the input image or described subject into a TRUE pixel-art game {asset_kind_label} designed for {asset_usage_label}, not a painted digital illustration. Subject: {name}. Subject kind: {subject_kind_label}. Canvas size must be exactly {width}x{height} pixels, where each pixel is one square cell of a conceptual pixel grid — do NOT draw any visible grid lines, gridlines, graph-paper or checkerboard pattern. Use large, chunky readable pixels, limited colors, and a simple silhouette. Use no more than {max_colors} visible subject colors; background color does not count. For human characters, make sure the face is flat and no shadow. The subject must be centered with clear empty pixel rows around all edges for safe sprite padding and {placement_context}. Fill the ENTIRE canvas edge to edge with one single flat uniform background color for chroma-key removal: the background must be perfectly solid with NO gradient, NO vignette, NO lighting or shading, NO drawn grid lines or graph paper, and NO border or frame; it must reach all four image edges. Choose a background color that is not close to any visible subject color, with color-distance greater than the removal tolerance ({key_tolerance} RGB Euclidean distance). No anti-aliasing or smoothing — every pixel must be a perfect square aligned to the conceptual pixel grid. The output image should be pixel-perfect, each cell only contains one color. {forbidden_elements}"

[sprite]
# 序列帧任务（mosaic 单图模式）默认值。
# 1 次 API 调用产出 rows×cols 网格 sprite sheet，后端按格切图（基于前景投影找
# 最佳切分线）+ chroma-key 抠色 + 共享调色板，最终输出 sprite_sheet.png +
# sprite_mosaic.png + sequence.json。
output_dir     = "图片/sprites"
# mosaic 网格默认值（前端面板默认 1×8 横排）
rows           = 1
cols           = 8
frame_count    = 8
# 总帧数上限：rows × cols ≤ 64
max_frame_count = 64
# 网格行/列上限（前端面板与后端校验共用）
max_grid_rows  = 8
max_grid_cols  = 8
fps            = 8
pixel_size     = [64, 64]
colors         = 16
dither         = "none"
image_quality  = "high"
# 兼容旧 GIF 间隔字段；新流程以 fps 为主，默认不生成 GIF
duration_ms    = 125
loop           = 0
gif_export     = false
frame_size_step = 16
anchor         = "bottom_center"
# auto 会按 prompt 动态选择不易撞色的纯色背景，也可固定为 HEX
green_screen_color = "auto"
green_screen_tolerance = 48
bg_tolerance   = 26
crop_padding   = 0.12
crop_square    = true
# 对全部帧应用共享调色板，减少序列播放闪色
shared_palette = true
# 多行 mosaic（rows>1）会自动按行输出独立产物，便于直接拿到「每行一个动画循环」的成品：
#   {run_dir}/sprite_sheet_grid.png   —— rows×cols 二维网格预览（与原 sprite_mosaic.png 一一对照）
#   {run_dir}/row_sheets/row_NN.png   —— 每行一张 1×cols 横向 sheet
#   {run_dir}/previews/row_NN.gif     —— 每行一个独立 GIF 动画（按 fps/duration_ms/loop 渲染）
# 单行（rows=1）时只生成原 sprite_sheet.png + 可选的 sprite.gif（gif_export=true 时）。
# Mosaic prompt 模板（无参考图）。
# 占位符：{description}/{rows}/{cols}/{frame_width}/{frame_height}/{sheet_width}/{sheet_height}/{row_block}/{green}/{key_tolerance}/{max_colors}
# 新增渲染尺寸占位符：{render_width}/{render_height}/{cell_render_width}/{cell_render_height}/{upscale}/{cell_art_width}/{cell_art_height}/{anchor_text}
# - sheet_width/sheet_height/frame_width/frame_height 表示最终 pixel-art 粒度；
# - render_width/render_height/cell_render_width/cell_render_height 表示 API 实际渲染画布；
# - upscale 表示每个 pixel-art 像素应被画成多少 render pixels 的实心方块；
# - cell_art_width/cell_art_height = cell_render ÷ upscale，即每格真实可绘像素网格（始终与 upscale 自洽，
#   横排方形帧被撑成竖长单元格时不再出现「frame_width×frame_height sprite」那种矛盾尺寸）；
# - anchor_text 是主体在单元格内的锚点（如 "bottom center"），配合自适应帧高使用。
# {row_block} 会被自动展开为 "Row 1: ...\nRow 2: ..." 的多行动作描述列表。
mosaic_prompt_template = "Create a TRUE pixel-art sprite sheet for the following subject. Subject: {description}. Layout: an exact {rows}x{cols} grid of sprites, read left-to-right then top-to-bottom. Render the entire image at exactly {render_width}x{render_height} render pixels; every cell occupies {cell_render_width}x{cell_render_height} render pixels. Draw every pixel-art pixel as a perfectly square block of {upscale}x{upscale} render pixels (no anti-aliasing inside the block), so each cell is a {cell_art_width}x{cell_art_height} pixel-art grid. Draw the subject at natural proportions, about {frame_width} pixel-art pixels wide and as large as fits, anchored to the {anchor_text} of each cell; fill every remaining pixel (especially the area above the subject) with the flat background key-color. Each row is one independent animation loop with {cols} frames, listed below:\n{row_block}\nCharacter/subject consistency: keep the same identity, palette, outline thickness, scale, proportions, and footprint across every cell. Background: use one flat solid key-color {green} for ALL empty/background pixels for chroma-key removal — the background must be perfectly uniform with NO gradient, NO vignette, NO lighting or shading, no faux 3D depth; keep visible colors outside the maximum key-color tolerance ({key_tolerance} RGB Euclidean distance) from {green}. Use no more than {max_colors} visible subject colors; background color does not count. Style: crisp pixel art, hard edges, limited palette, no painterly blending, no anti-aliased soft brush. Do not add text, watermark, UI, border, grid lines, labels, numbers, or shadows outside the subject. Do not draw extra frames outside the {rows}x{cols} grid."
# Mosaic + 参考角色立绘（图生图）prompt 模板。
# 占位符额外包含 {base_template}：会被替换为已渲染好的 mosaic_prompt_template 文本。
mosaic_reference_prompt_template = "Re-create the sprite sheet described below based on the provided reference image as the character source. The reference image defines the core character design (silhouette, palette, costume, proportions). Reuse the reference character identity in EVERY cell; only the action/pose changes per cell.\n\n{base_template}\n\nStrictly preserve the reference character's identity, color palette, and proportions across every cell."

[cache]
enabled        = true
