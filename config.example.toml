# pix 默认配置示例
# 复制为 config.toml 即可被自动加载；CLI / GUI 参数会覆盖这里的值。
# 网站版管理后台也可以覆盖 [api]、[image_gen]、[vision] 和 [asset] 中的常用字段；
# 后台保存的值优先于本文件，环境级密钥/数据库/队列配置仍建议使用环境变量或密钥管理。

[api]
base_url       = "https://www.packyapi.com"
# 连接与读取超时（秒）；生图可能较慢，给足余量
timeout        = 180.0
max_retries    = 3

[image_gen]
model          = "gpt-image-2"
size           = "1024x1024"      # 见 Packy 文档；auto/1024x1024/1536x1024/1024x1536/2048x2048/... 
quality        = "high"           # low | medium | high | auto
output_format  = "png"
# 图生图编辑时尽量保留原图主体和细节：low | high
edit_input_fidelity = "high"
# 默认受控生图：一次生成九宫格候选，后端切图并抠纯绿幕背景。
contact_sheet_enabled = true
contact_sheet_rows = 3
contact_sheet_cols = 3
green_screen_color = "#00FF00"
green_screen_tolerance = 48
contact_sheet_prompt_template = "Create a {rows}x{cols} contact sheet containing exactly {count} distinct variations of: {description}. Each cell contains one centered isolated game asset icon, consistent scale, clear spacing, no overlap. Use a pure green screen background {green} across the entire image for easy chroma-key removal. No text, no watermark, no UI frame, no labels, no extra props outside each item. Readable silhouette, high contrast, thick dark outline, pixel-art friendly details, designed to become a {width}x{height} RPG inventory sprite."
# 用户描述审核：本地规则默认生效；remote=true 时会尝试用 VL/chat 模型审核用户原始输入，失败默认退回本地规则。
prompt_guard_enabled = true
prompt_guard_remote = true
prompt_guard_model = ""              # 留空使用 [vision].model
prompt_guard_failure_policy = "local" # local | reject
prompt_guard_max_chars = 500
# 候选排序：九宫格切出的候选会一次性送入 VL 按效果评分，最高分作为默认 01_source.png。
candidate_vl_ranking_enabled = true
candidate_vl_ranking_model = ""              # 留空使用 [vision].model
candidate_vl_ranking_failure_policy = "first" # first | reject

[vision]
# Packy 支持的视觉模型，示例：claude-opus-4-7 / claude-sonnet-4-5 / gemini-2.5-pro / gpt-4o 等
model          = "claude-opus-4-7"
temperature    = 0.2
max_tokens     = 2048
# 连续 JSON 校验失败时的重试次数
retry_on_parse = 1

[pixelize]
# 目标像素图尺寸（宽, 高）
output_size    = [128, 128]
# 调色板颜色数（4..256）
colors         = 16
# none | ordered | floyd_steinberg
dither         = "floyd_steinberg"
# 预设：auto | gameboy | nes | modern_pixel | pico8
preset         = "auto"
# 预览放大倍数（0 表示不输出放大预览）
preview_scale  = 4
# 主体轻微锐化强度 0..1
edge_enhance   = 0.1
# 饱和度缩放 0.5..1.5
saturation     = 1.0
# 下采样策略：smart（推荐，自动对齐像素格）| box | bicubic | lanczos | nearest
resample       = "smart"
# smart 模式下是否探测输入的像素格并吸附到整数倍
snap_to_grid   = true
# 自动抠背景：四角连通色变透明，保存为 PNG 带 alpha
remove_bg      = false
# 背景容差（每通道欧氏距离阈值，越大抠越狠；8-24 常用）
bg_tolerance   = 12
# 边缘风格：hard=硬边，feather=alpha 羽化，outline=外侧描边（三者互斥）
# 32px 及以下低像素透明素材会自动改用 outline，避免羽化导致边缘发虚。
edge_style     = "hard"
# 边缘强度：edge_style=feather 时为羽化半径；outline 时为描边宽度；hard 时不生效；低像素描边至少 1px
bg_feather     = 0
# 自动裁剪主体后再缩小，适合图标/物品素材
auto_crop      = false
crop_padding   = 0.12
crop_square    = true

[asset]
# 游戏素材直出命令 pix asset 的默认值
output_dir     = "图片"
# 16x16 以下仅允许 [8, 8]；8x8 会强制 AI Grid 直绘且失败不回退
pixel_size     = [16, 16]
colors         = 12
dither         = "none"
preview_scale  = 12
# 同步复制原始生图源文件到最终目录旁边，便于对比：xxx_source.png
source_copy    = true
image_quality  = "low"
skip_vl        = true
remove_bg      = true
bg_tolerance   = 26
bg_feather     = 0
auto_crop      = true
crop_padding   = 0.12
crop_square    = true
# 默认启用 Pixel Grid JSON 工程图：先提取 XY 网格 JSON，再精确渲染最终 PNG
grid_mode      = true
# 是否让 AI 审核/修正 Grid JSON；默认关闭以节省成本
grid_review    = false
# 是否保留 .grid.json 工程文件
grid_json      = true
# AI Grid 直绘默认关闭：开启后让模型直接返回 palette + pixels[y][x] 字符串矩阵，适合 16/22/32 小图标；8x8 会强制启用；会增加额外模型调用成本
ai_grid        = false
ai_grid_retries = 1
ai_grid_instruction = ""
ai_grid_fallback = "extract"  # extract | pixelize | fail
# 可选：手绘图标参考目录。AI Grid 会挑选少量 16x16 人工图标作为风格参考，学习留白、轮廓、色阶和高光，而不是照抄题材。
# 示例：style_reference_dir = "D:/伏魔录项目/美工/icon"
style_reference_dir = ""
style_reference_limit = 3
# AI Grid 会把源图按检测到的实际像素格解析成 draft 工程图，并把原始 prompt + 源图 + draft 预览一起交给 VL；draft 最大轴过大时会等比限制，避免塞入过长矩阵
ai_grid_draft = true
ai_grid_draft_max_axis = 64
ai_grid_draft_preview_scale = 8
# Grid 后处理：清理孤立噪点、统一主体深色轮廓
grid_cleanup   = true
grid_outline   = true
grid_outline_strength = 1
grid_min_neighbors = 1
# 生成后把主体 bbox 确定性贴合目标画布，尤其适合按钮、横条、面板等非方形 UI 素材
fit_canvas      = true
fit_mode        = "smart"  # smart | contain | stretch
fit_padding     = 1
fit_min_axis_coverage = 0.7
prompt_template = "A single fantasy pixel game inventory item icon of {name}. Centered object, isolated on pure green screen background #00FF00, no text, no UI frame, no shadow outside the item, thick dark outline, high contrast, readable silhouette, designed to become a {width}x{height} RPG inventory sprite."

[cache]
enabled        = true
dir            = ".pix_cache"

[output]
# 默认输出根目录；最终目录为 {root}/{timestamp}-{short_hash}
root           = "outputs"

[history]
# GUI/CLI 历史查询默认最多扫描显示的记录数
max_items      = 200

[ui]
# GUI 界面语言：zh-CN | zh-TW | en | ja | ko | fr | de | es | ru
language       = "zh-CN"
