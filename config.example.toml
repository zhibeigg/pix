# pix 默认配置示例
# 复制为 config.toml 即可被自动加载；CLI / GUI 参数会覆盖这里的值。
# 网站版管理后台也可以覆盖 [api]、[image_gen]、[vision] 和 [asset] 中的常用字段；
# 后台保存的值优先于本文件，环境级密钥/数据库/队列配置仍建议使用环境变量或密钥管理。

[api]
base_url       = "https://www.packyapi.com"
# 连接与读取超时（秒）；生图可能较慢，给足余量
timeout        = 180.0
max_retries    = 3

[image_gen]
model          = "gpt-image-2"
size           = "1024x1024"      # 见 Packy 文档；auto/1024x1024/1536x1024/1024x1536/2048x2048/... 
quality        = "high"           # low | medium | high | auto
output_format  = "png"
# 图生图编辑时尽量保留原图主体和细节：low | high
edit_input_fidelity = "high"
# 默认受控生图：一次生成九宫格候选，后端切图并抠纯色 key background。
contact_sheet_enabled = true
contact_sheet_rows = 3
contact_sheet_cols = 3
# auto 会按 prompt 动态选择不易撞色的纯色背景（如 #FF00FF/#00FFFF/#00FF00），也可固定为某个 HEX。
# 绿色背景不适合所有题材：玉石/毒液/草地等会和 #00FF00 撞色。
green_screen_color = "auto"
green_screen_tolerance = 48
contact_sheet_prompt_template = "Create a {rows}x{cols} contact sheet containing exactly {count} distinct variations of: {description}. Each cell contains one centered isolated game asset icon, consistent scale, clear spacing, no overlap. Use a pure solid key-color background {green} across the entire image for easy chroma-key removal. No text, no watermark, no UI frame, no labels, no extra props outside each item. Readable silhouette, high contrast, thick dark outline, pixel-art friendly details, designed to become a {width}x{height} RPG inventory sprite."
# 用户描述审核：本地规则默认生效；remote=true 时会尝试用 VL/chat 模型审核用户原始输入，失败默认退回本地规则。
prompt_guard_enabled = true
prompt_guard_remote = true
prompt_guard_model = ""              # 留空使用 [vision].model
prompt_guard_failure_policy = "local" # local | reject
prompt_guard_max_chars = 500
# 候选排序：九宫格切出的候选会一次性送入 VL 按效果评分，最高分作为默认 01_source.png。
candidate_vl_ranking_enabled = true
candidate_vl_ranking_model = ""              # 留空使用 [vision].model
candidate_vl_ranking_failure_policy = "first" # first | reject
# 候选生成模式：
#   n_sample     —— 直接让模型返回 N 张独立 full-res 图，每张单独抠色，VL 看 full-res 评分（推荐）
#   contact_sheet —— 旧路径：生成 RxC 九宫格再切图；候选细节更少
candidate_mode = "n_sample"
# n_sample 模式下的候选数量，建议 3~6
n_sample_count = 4
# 若 provider 单次 n=N 不够 N 张，fallback 循环补齐时追加的 prompt 变体（非强约束，仅鼓励差异）
n_sample_prompt_variations = [
    "slight variation in color tone.",
    "slight variation in lighting and highlight.",
    "slight variation in material texture emphasis.",
    "slight variation in silhouette pose.",
]
n_sample_prompt_template = "Create a single game asset icon of: {description}. One centered isolated object, consistent scale, clear spacing, no overlap. Use a pure solid key-color background {green} for easy chroma-key removal. No text, no watermark, no UI frame, no labels, no extra props outside the item. Readable silhouette, high contrast, thick dark outline, pixel-art friendly details, designed to become a {width}x{height} RPG inventory sprite."

[vision]
# Packy 支持的视觉模型，示例：claude-opus-4-7 / claude-sonnet-4-5 / gemini-2.5-pro / gpt-4o 等
model          = "claude-opus-4-7"
temperature    = 0.2
max_tokens     = 2048
# 连续 JSON 校验失败时的重试次数
retry_on_parse = 1

[pixelize]
# 目标像素图尺寸（宽, 高）
output_size    = [128, 128]
# 调色板颜色数（4..256）
colors         = 16
# none | ordered | floyd_steinberg
dither         = "floyd_steinberg"
# 预设：auto | gameboy | nes | modern_pixel | pico8
preset         = "auto"
# 预览放大倍数（0 表示不输出放大预览）
preview_scale  = 4
# 主体轻微锐化强度 0..1
edge_enhance   = 0.1
# 饱和度缩放 0.5..1.5
saturation     = 1.0
# 下采样策略：smart（推荐，自动对齐像素格）| box | bicubic | lanczos | nearest
resample       = "smart"
# smart 模式下是否探测输入的像素格并吸附到整数倍
snap_to_grid   = true
# 自动抠背景：四角连通色变透明，保存为 PNG 带 alpha
remove_bg      = false
# 背景容差（每通道欧氏距离阈值，越大抠越狠；8-24 常用）
bg_tolerance   = 12
# 边缘风格：hard=硬边，feather=alpha 羽化，outline=外侧描边（三者互斥）
# 32px 及以下低像素透明素材会自动改用 outline，避免羽化导致边缘发虚。
edge_style     = "hard"
# 边缘强度：edge_style=feather 时为羽化半径；outline 时为描边宽度；hard 时不生效；低像素描边至少 1px
bg_feather     = 0
# 自动裁剪主体后再缩小，适合图标/物品素材
auto_crop      = false
crop_padding   = 0.12
crop_square    = true
# 调色板策略：
#   auto   —— 保持经典 K-means 量化（默认，兼容旧行为）
#   ramp   —— VL（失败时本地按 HSL 聚合兜底）给出 outline→shadow→mid→highlight 色相阶梯，Lab 最近色量化
#   kmeans —— 强制 K-means，禁止 VL 介入
palette_mode   = "auto"

[asset]
# 游戏素材直出命令 pix asset 的默认值
output_dir     = "图片"
# 仅支持 ≥16x16，所有尺寸统一走 extract Pixel Grid
pixel_size     = [16, 16]
colors         = 12
dither         = "none"
preview_scale  = 12
# 同步复制原始生图源文件到最终目录旁边，便于对比：xxx_source.png
source_copy    = true
image_quality  = "low"
skip_vl        = true
remove_bg      = true
bg_tolerance   = 26
bg_feather     = 0
auto_crop      = true
crop_padding   = 0.12
crop_square    = true
# 默认启用 Pixel Grid JSON 工程图：先提取 XY 网格 JSON，再精确渲染最终 PNG
grid_mode      = true
# 是否保留 .grid.json 工程文件
grid_json      = true
# Grid 后处理默认关闭，最大程度保留经典白底单图提取结果；需要时可显式开启清噪/轮廓加粗
grid_cleanup   = false
grid_outline   = false
grid_outline_strength = 1
grid_min_neighbors = 1
# 生成后是否把主体 bbox 确定性贴合目标画布；默认关闭以保留早期白底单图的自然留白
fit_canvas      = false
fit_mode        = "smart"  # smart | contain | stretch
fit_padding     = 1
fit_min_axis_coverage = 0.7
# Asset 直出默认使用经典 auto/K-means 调色，贴近早期白底单图素材效果；可手动改为 ramp。
# 可选：auto | ramp | kmeans。
palette_mode    = "auto"
prompt_template = "A single fantasy pixel game inventory item icon of {name}. Centered object, isolated on plain white background, no text, no UI frame, no shadow outside the item, thick dark outline, high contrast, readable silhouette, designed to become a {width}x{height} RPG inventory sprite."

[cache]
enabled        = true
dir            = ".pix_cache"

[output]
# 默认输出根目录；最终目录为 {root}/{timestamp}-{short_hash}
root           = "outputs"

[history]
# GUI/CLI 历史查询默认最多扫描显示的记录数
max_items      = 200

[ui]
# GUI 界面语言：zh-CN | zh-TW | en | ja | ko | fr | de | es | ru
language       = "zh-CN"
