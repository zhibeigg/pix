# Pix Web 核心配置示例
# 如需覆盖默认素材生成参数，可复制为 config.toml，并通过 PIX_WEB_PIX_CONFIG 指向该文件。
# 网站版管理后台也可以覆盖 [api]、[image_gen]、[vision] 和 [asset] 中的常用字段；
# 后台保存的值优先于本文件，环境级密钥/数据库/队列配置仍建议使用环境变量或密钥管理。

[api]
base_url       = "https://www.packyapi.com"
# 连接与读取超时（秒）；生图可能较慢，给足余量
timeout        = 180.0
max_retries    = 3

[image_gen]
model          = "gpt-image-2"
size           = "1024x1024"      # 见 Packy 文档；auto/1024x1024/1536x1024/1024x1536/2048x2048/... 
quality        = "high"           # low | medium | high | auto
output_format  = "png"
# 图生图编辑时尽量保留原图主体和细节：low | high
edit_input_fidelity = "high"
# 默认受控生图：一次生成九宫格候选，后端切图并抠纯色 key background。
contact_sheet_enabled = true
contact_sheet_rows = 3
contact_sheet_cols = 3
# auto 会按 prompt 动态选择不易撞色的纯色背景（如 #FF00FF/#00FFFF/#00FF00），也可固定为某个 HEX。
# 绿色背景不适合所有题材：玉石/毒液/草地等会和 #00FF00 撞色。
green_screen_color = "auto"
green_screen_tolerance = 48
contact_sheet_prompt_template = "Create a {rows}x{cols} contact sheet containing exactly {count} distinct TRUE pixel-art game asset candidates from this generation brief: {description}. In every cell, follow the generation brief exactly, not a painted digital illustration. Canvas size for each candidate must be exactly {width}x{height} pixels, where each pixel is one square grid cell. Use large, chunky readable pixels, limited colors, and a simple silhouette. For human characters, make sure the face is flat and no shadow. The subject must be centered with clear empty pixel rows around all edges for safe sprite padding and clean extraction. Use pure solid key-color {green} for all empty/background cells for chroma-key removal; keep every visible subject color outside the maximum key-color tolerance ({key_tolerance} RGB Euclidean distance) from {green}. No anti-aliasing or smoothing — every pixel must be a perfect square aligned to the grid. The output image should be pixel-perfect, each grid cell only contains one color. No text, no watermark, no extra frame, no labels."
# 用户描述审核：本地规则默认生效；remote=true 时会尝试用 VL/chat 模型审核用户原始输入，失败默认退回本地规则。
prompt_guard_enabled = true
prompt_guard_remote = true
prompt_guard_model = ""              # 留空使用 [vision].model
prompt_guard_failure_policy = "local" # local | reject
prompt_guard_max_chars = 500 # 常规素材描述上限；原始生图 source_only 固定允许 3000 字
# 候选排序：九宫格切出的候选会一次性送入 VL 按效果评分，最高分作为默认 01_source.png。
candidate_vl_ranking_enabled = true
candidate_vl_ranking_model = ""              # 留空使用 [vision].model
candidate_vl_ranking_failure_policy = "first" # first | reject
# 候选生成模式：
#   n_sample     —— 直接让模型返回 N 张独立 full-res 图，每张单独抠色，VL 看 full-res 评分（推荐）
#   contact_sheet —— 旧路径：生成 RxC 九宫格再切图；候选细节更少
candidate_mode = "n_sample"
# n_sample 模式下的候选数量，建议 3~6
n_sample_count = 4
# 若 provider 单次 n=N 不够 N 张，fallback 循环补齐时追加的 prompt 变体（非强约束，仅鼓励差异）
n_sample_prompt_variations = [
    "slight variation in color tone.",
    "slight variation in lighting and highlight.",
    "slight variation in material texture emphasis.",
    "slight variation in silhouette pose.",
]
n_sample_prompt_template = "Create one TRUE pixel-art game asset candidate from this generation brief: {description}. Follow the generation brief exactly, not a painted digital illustration. Canvas size must be exactly {width}x{height} pixels, where each pixel is one square grid cell. Use large, chunky readable pixels, limited colors, and a simple silhouette. For human characters, make sure the face is flat and no shadow. The subject must be centered with clear empty pixel rows around all edges for safe sprite padding and clean extraction. Use pure solid key-color {green} for all empty/background cells for chroma-key removal; keep every visible subject color outside the maximum key-color tolerance ({key_tolerance} RGB Euclidean distance) from {green}. No anti-aliasing or smoothing — every pixel must be a perfect square aligned to the grid. The output image should be pixel-perfect, each grid cell only contains one color. No text, no watermark, no extra frame, no labels."

[vision]
# Packy 支持的视觉模型，示例：claude-opus-4-7 / claude-sonnet-4-5 / gemini-2.5-pro / gpt-4o 等
model          = "claude-opus-4-7"
temperature    = 0.2
max_tokens     = 2048
# 连续 JSON 校验失败时的重试次数
retry_on_parse = 1

[pixelize]
# 目标像素图尺寸（宽, 高）
output_size    = [128, 128]
# 调色板颜色数（4..256）
colors         = 16
# none | ordered | floyd_steinberg
dither         = "floyd_steinberg"
# 预设：auto | gameboy | nes | modern_pixel | pico8
preset         = "auto"
# 预览放大倍数（0 表示不输出放大预览）
preview_scale  = 4
# 主体轻微锐化强度 0..1
edge_enhance   = 0.1
# 饱和度缩放 0.5..1.5
saturation     = 1.0
# 下采样策略：smart（推荐，自动对齐像素格）| box | bicubic | lanczos | nearest
resample       = "smart"
# smart 模式下是否探测输入的像素格并吸附到整数倍
snap_to_grid   = true
# 自动抠背景：四角连通色变透明，保存为 PNG 带 alpha
remove_bg      = false
# 背景容差（每通道欧氏距离阈值，越大抠越狠；8-24 常用）
bg_tolerance   = 12
# 边缘风格：hard=不额外处理，feather=alpha 羽化，outline=外侧描边（三者互斥）
# 低像素透明素材会尊重用户/配置选择，不再自动强制改用 outline。
edge_style     = "hard"
# 边缘强度：edge_style=feather 时为羽化半径；outline 时为描边宽度；hard 时不生效
bg_feather     = 0
# 自动裁剪主体后再缩小，适合图标/物品素材
auto_crop      = false
crop_padding   = 0.12
crop_square    = true
# 调色板策略：
#   auto   —— 保持经典 K-means 量化（默认，兼容旧行为）
#   ramp   —— VL（失败时本地按 HSL 聚合兜底）给出 outline→shadow→mid→highlight 色相阶梯，Lab 最近色量化
#   kmeans —— 强制 K-means，禁止 VL 介入
palette_mode   = "auto"
# AI 生图/图生图源图进入像素化前的首步网格对齐预处理；本地上传 pixelize 默认不启用。
# perfect_pixel=使用内置 perfectPixel 风格 FFT+Sobel 网格采样；legacy/none=旧流程。
generated_preprocess_method = "perfect_pixel"

[asset]
# 网站素材直出 asset 任务的默认值。
output_dir     = "图片"
# 仅支持 ≥16x16，所有尺寸统一走 extract Pixel Grid
pixel_size     = [16, 16]
colors         = 12
dither         = "none"
preview_scale  = 12
# 同步复制原始生图源文件到最终目录旁边，便于对比：xxx_source.png
source_copy    = true
image_quality  = "low"
skip_vl        = true
remove_bg      = true
bg_tolerance   = 26
# 背景移除算法：固定使用 Color-to-Alpha；旧选项仅为兼容历史配置。
bg_removal_algorithm = "color_to_alpha" # color_to_alpha
color_to_alpha_shape = "sphere" # sphere | cube
color_to_alpha_transparency = 48
color_to_alpha_opacity = 255
color_to_alpha_interpolation = "linear"
# 默认不做额外边缘处理；可按需改为 feather 或 outline
edge_style     = "hard"
bg_feather     = 0
auto_crop      = true
crop_padding   = 0.12
crop_square    = true
# 默认启用 Pixel Grid JSON 工程图：先提取 XY 网格 JSON，再精确渲染最终 PNG
grid_mode      = true
# 是否保留 .grid.json 工程文件
grid_json      = true
# Grid 后处理默认关闭，最大程度保留经典单图纯色背景提取结果；需要时可显式开启清噪/轮廓加粗
grid_cleanup   = false
grid_outline   = false
grid_outline_strength = 1
grid_min_neighbors = 1
# 生成后是否把主体 bbox 确定性贴合目标画布；默认关闭以保留早期单图的自然留白
fit_canvas      = false
fit_mode        = "smart"  # smart | contain | stretch
fit_padding     = 1
fit_min_axis_coverage = 0.7
# Asset 直出默认使用经典 auto/K-means 调色，贴近早期单图素材效果；可手动改为 ramp。
# 可选：auto | ramp | kmeans。
palette_mode    = "auto"
# 默认模板只需要用户填写 Subject 后的主体内容；Web 可通过素材类型/主体类型选择入口参数。
# {width}x{height} 随输出尺寸自动填充；{max_colors}/{colors} 使用用户实际选择的颜色上限；{key_tolerance} 仅约束背景与主体的最小色距。
# {asset_kind_label}/{asset_usage_label}/{subject_kind_label}/{placement_context}/{forbidden_elements} 会按物品图标或 UI 组件自动分开填充，避免同一 prompt 同时出现物品和 UI 语义。
prompt_template = "Convert the input image or described subject into a TRUE pixel-art game {asset_kind_label} designed for {asset_usage_label}, not a painted digital illustration. Subject: {name}. Subject kind: {subject_kind_label}. Canvas size must be exactly {width}x{height} pixels, where each pixel is one square grid cell. Use large, chunky readable pixels, limited colors, and a simple silhouette. Use no more than {max_colors} visible subject colors; background color does not count. For human characters, make sure the face is flat and no shadow. The subject must be centered with clear empty pixel rows around all edges for safe sprite padding and {placement_context}. Use a pure solid single-color background for chroma-key removal; choose a background color that is not close to any visible subject color, with color-distance greater than the removal tolerance ({key_tolerance} RGB Euclidean distance). No anti-aliasing or smoothing — every pixel must be a perfect square aligned to the grid. The output image should be pixel-perfect, each grid cell only contains one color. {forbidden_elements}"

[sprite]
# 网站序列帧任务默认值：首帧文生图，后续逐帧图生图，最终输出横向 sprite_sheet.png + sequence.json。
output_dir     = "图片/sprites"
# rows/cols 为历史兼容字段；新流程不再生成九宫格。
rows           = 1
cols           = 9
frame_count    = 9
max_frame_count = 12
fps            = 8
pixel_size     = [64, 64]
colors         = 16
dither         = "none"
image_quality  = "high"
# 兼容旧 GIF 间隔字段；新流程以 fps 为主，默认不生成 GIF。
duration_ms    = 125
loop           = 0
gif_export     = false
frame_size_step = 16
oversize_regenerate_threshold = 1.5
max_frame_retries = 2
anchor         = "bottom_center"
reference_policy = "first_frame_and_previous_frame"
# auto 会按 prompt 动态选择不易撞色的纯色背景，也可固定为 HEX。
green_screen_color = "auto"
green_screen_tolerance = 48
# 抠色模式字段保留兼容；新序列帧后处理复用 asset 的 Color-to-Alpha 配置。
key_mode       = "hard"  # hard | soft
key_softness   = 150
key_alpha_floor = 12
key_despill    = true
bg_tolerance   = 26
crop_padding   = 0.12
crop_square    = true
# 对全部帧应用共享调色板，减少序列播放闪色。
shared_palette = true
prompt_template = "Create frame 1 of a {frame_count}-frame TRUE pixel-art animation sequence. Subject/action: {description}. Action phase: {action_phase}. Canvas contract: one single frame only, target frame size {width}x{height} logical pixels, where each pixel is one square grid cell. The character/effect should fit inside this frame whenever possible. Use no more than {max_colors} visible subject/effect colors; background color does not count. Use pure solid key-color {green} for all empty/background pixels for chroma-key removal; keep visible colors outside the maximum key-color tolerance ({key_tolerance} RGB Euclidean distance) from {green}. Anchor: keep the subject aligned to {anchor}. {loop_closure} Style: crisp pixel art, hard edges, limited palette, no painterly blending, no anti-aliased soft brush. Do not draw a sprite sheet, do not draw multiple frames, do not add text, watermark, UI, border, grid, labels, or shadows outside the sprite."
next_frame_prompt_template = "Generate frame {frame_index} of {frame_count} in the same TRUE pixel-art animation sequence. {reference_instruction} Subject/action identity to preserve: {description}. Keep the same character identity, costume, palette, outline thickness, camera, scale, facing direction, and anchor. Previous phase: {previous_action_phase}. Current action phase: {action_phase}. Canvas contract: one single frame only, target frame size {width}x{height} logical pixels, where each pixel is one square grid cell. The subject should remain inside the frame and aligned consistently. Use pure solid key-color {green} for all empty/background pixels for chroma-key removal; keep visible colors outside the maximum key-color tolerance ({key_tolerance} RGB Euclidean distance) from {green}. Use no more than {max_colors} visible subject/effect colors; background color does not count. {loop_closure} Do not create a grid, collage, sprite sheet, duplicate character, text, watermark, background scene, labels, numbers, or extra frames. {retry_hint}"

[cache]
enabled        = true
dir            = ".pix_cache"

[output]
# 默认输出根目录；最终目录为 {root}/{timestamp}-{short_hash}
root           = "outputs"
